name: Feature request
description: Suggest something the preview should render or do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it. If it's Markdown syntax, include an example and where it comes from (GitHub, Obsidian, pandoc, …).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
